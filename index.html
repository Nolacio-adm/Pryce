<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scanner Concorrente PWA</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://unpkg.com/vanilla-masker@1.2.0/build/vanilla-masker.min.js"></script>
    <style>
        /* Estilos otimizados para Mobile First e Container de Celular */
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100dvh;
            background: #0b0f19;
            margin: 0;
            overflow: hidden;
        }

        .mobile-frame {
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            min-height: 100dvh;
            max-height: none;
            background-color: #f4f7f6;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            padding-bottom: calc(30px + env(safe-area-inset-bottom));
            box-sizing: border-box;
        }

        #reader { width: 100%; max-width: 500px; border-radius: 12px; overflow: hidden; background: #000; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-top: 15px; width: 100%; max-width: 460px; box-sizing: border-box; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        
        #inputPreco, #inputPreco2 {
            max-width: 100%;
            display: block;
        }
        
        button { padding: 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: opacity 0.2s; }
        button:active { opacity: 0.8; }
        .btn-success { background: #28a745; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-primary { background: #007bff; color: white; font-size: 1.1em; }
        #result { margin-top: 10px; font-weight: bold; min-height: 40px; padding: 12px; border-radius: 6px; display: none; }
        .success { color: #155724; background: #d4edda; display: block !important; }
        .error { color: #721c24; background: #f8d7da; display: block !important; }
        .progress-container { width: 100%; max-width: 460px; margin-bottom: 15px; }
        #priceSection {
            display: none;
            width: 100%;
            margin-top: 15px;
            border-top: 1px solid #eee;
            padding-top: 15px;
            padding-bottom: 10px;
            box-sizing: border-box;
        }

        #priceSection p {
            margin-top: 0;
        }

        #priceSection input {
            min-height: 52px;
            margin-bottom: 15px;
        }

        #formSection {
            flex-shrink: 0;
        }

        /* Em telas pequenas, o conteúdo pode ultrapassar a altura da tela
           sem cortar o campo de atacado. */
        @media (max-width: 600px) {
            body {
                align-items: flex-start;
            }

            .mobile-frame {
                height: 100dvh;
                max-height: none;
                padding-left: 12px;
                padding-right: 12px;
            }

            .card {
                padding: 16px;
            }

            #formSection {
                margin-bottom: 20px;
            }
        }

        /* Quando o teclado virtual aparece, mantemos o formulário rolável. */
        @media (max-height: 600px) {
            .mobile-frame {
                align-items: stretch;
            }

            #formSection {
                margin-bottom: 30px;
            }

            #priceSection input {
                min-height: 48px;
            }
        }
    </style>
</head>
<body>

    <div class="mobile-frame">
        <h2 style="margin: 10px 0; color: #333;">Scanner Concorrente</h2>

        <div class="progress-container">
            <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; color: #555;">
                <span>Progresso da Coleta</span>
                <strong id="txtProgresso">0/0</strong>
            </div>
            <div style="width: 100%; background: #ddd; height: 12px; border-radius: 6px; overflow: hidden;">
                <div id="barraProgresso" style="width: 0%; height: 100%; background: #28a745; transition: width 0.4s ease-out;"></div>
            </div>
        </div>

        <!-- Área de Entrada -->
        <div id="scannerArea" style="width: 100%; max-width: 500px; display: flex; flex-direction: column; align-items: center;">
            <div id="reader"></div>
            <div id="manualArea" class="card">
                <p style="margin: 0 0 10px 0; font-size: 14px; color: #666;">Entrada Manual:</p>
                <input type="text" id="inputManual" inputmode="numeric" pattern="[0-9]*" placeholder="Digite o código de barras">
                <button onclick="verificarManual()" class="btn-secondary">Verificar Produto</button>
            </div>
        </div>

        <!-- Formulário de Preço -->
        <div id="formSection" class="card" style="display: none;">
            <div id="result"></div>
            <div id="priceSection">
                <p style="font-weight: bold; margin-bottom: 5px; color: #333;">Preço Varejo:</p>
                <input type="text" id="inputPreco" inputmode="decimal" placeholder="R$ 0,00" style="font-size: 1.5em; text-align: center;">

                <p style="font-weight: bold; margin-bottom: 5px; color: #333;">Preço Atacado:</p>
                <input type="text" id="inputPreco2" inputmode="decimal" placeholder="R$ 0,00" style="font-size: 1.5em; text-align: center;">

                <button class="btn-primary" onclick="salvarPreco()">Confirmar e Voltar</button>
                <button class="btn-secondary" onclick="resetarApp()" style="margin-top: 10px; background: transparent; color: #666;">Cancelar</button>
            </div>
        </div>
    </div>

<script>
    let codigoAtual = ""; 
    let scannerIniciado = false;
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbwfhj30NWTl2vXea_mqFAO21lo9s1yiLJt0S5YCDAUhq9JKEyar6qNL_p4DKO-UZCSE/exec";

    // Inicialização do Scanner
    const html5QrCode = new Html5QrcodeScanner("reader", {
        fps: 10,
        qrbox: {width: 250, height: 150},
        aspectRatio: 1.0,
        rememberLastUsedCamera: true,
        supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
    });

    function iniciarCamera() {
        if (!scannerIniciado) {
            html5QrCode.render((decodedText) => {
                processarCodigo(decodedText);
            });
            scannerIniciado = true;
        }
    }

    function processarCodigo(codigo) {
        codigoAtual = codigo;
        
        document.getElementById('scannerArea').style.display = 'none';
        document.getElementById('formSection').style.display = 'block';
        document.getElementById('priceSection').style.display = 'none';
        
        html5QrCode.clear().then(() => {
            scannerIniciado = false;
        }).catch(err => {
            console.error("Erro ao limpar scanner:", err);
            scannerIniciado = false;
        });

        enviarConsulta(codigo);
    }

    function verificarManual() {
        let cod = document.getElementById('inputManual').value.trim();
        if (cod) processarCodigo(cod);
        else alert("Digite um código!");
    }

    function enviarConsulta(codigo) {
        const resultDiv = document.getElementById('result');
        resultDiv.className = ''; 
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = "⏳ Buscando item...";

        chamadaJSONP(`${URL_SCRIPT}?barcode=${encodeURIComponent(codigo)}&callback=retornoGoogle`, 'jsonp-request');
    }

    function retornoGoogle(res) {
        const resultDiv = document.getElementById('result');
        const priceSection = document.getElementById('priceSection');
        
        if (res.stats) {
            localStorage.setItem('stats_coleta', JSON.stringify(res.stats));
            atualizarInterfaceProgresso(res.stats);
        }

        if(res.status === "sucesso") {
            resultDiv.className = 'success';
            resultDiv.innerHTML = `<h2 style="margin:0">${res.nome}</h2><small>${res.embalagem}</small>`;
            // Mostra os dois campos de preço explicitamente.
            priceSection.style.display = 'block';

            // No celular, leva o formulário para uma posição onde os dois
            // campos possam ser vistos/rolados mesmo com o teclado aberto.
            setTimeout(() => {
                const formSection = document.getElementById('formSection');
                const inputPreco = document.getElementById('inputPreco');

                formSection.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });

                setTimeout(() => inputPreco.focus(), 250);
            }, 100);
        } else if (res.status === "salvo") {
            resultDiv.className = 'success';
            resultDiv.innerHTML = "✅ Preço salvo com sucesso!";
            
            atualizarProgressoManual();
            
            setTimeout(() => resetarApp(), 1500);
        } else {
            resultDiv.className = 'error';
            resultDiv.innerHTML = "❌ Não cadastrado no banco.";
            setTimeout(() => resetarApp(), 2500);
        }
    }

    function salvarPreco() {
    let p1Raw = document.getElementById('inputPreco').value;
    let p2Raw = document.getElementById('inputPreco2').value;

    // Remove apenas o R$ e espaços, mantendo a vírgula decimal
    let p1 = p1Raw.replace("R$", "").trim();
    let p2 = p2Raw.replace("R$", "").trim();

    if (!p1 || p1 === "0,00" || p1 === "0") {
        alert("Digite ao menos o preço de varejo!");
        return;
    }

    document.getElementById('result').innerHTML = "⏳ Gravando na planilha...";

    chamadaJSONP(
        `${URL_SCRIPT}?barcode=${encodeURIComponent(codigoAtual)}&preco=${encodeURIComponent(p1)}&preco2=${encodeURIComponent(p2)}&callback=retornoGoogle`,
        'save-request'
    );
}

    function chamadaJSONP(url, id) {
        const oldScript = document.getElementById(id);
        if (oldScript) oldScript.remove();
        const script = document.createElement('script');
        script.id = id;
        script.src = url;
        script.onerror = () => {
            document.getElementById('result').className = 'error';
            document.getElementById('result').innerHTML = "❌ Erro de conexão.";
            setTimeout(resetarApp, 2000);
        };
        document.body.appendChild(script);
    }

    function resetarApp() {
        document.getElementById('formSection').style.display = 'none';
        document.getElementById('priceSection').style.display = 'none';
        document.getElementById('result').style.display = 'none';
        document.getElementById('inputManual').value = "";
        document.getElementById('inputPreco').value = "";
        document.getElementById('inputPreco2').value = "";
        document.getElementById('scannerArea').style.display = 'flex';
        
        iniciarCamera();
    }

    function atualizarInterfaceProgresso(stats) {
        if (!stats || stats.total === 0) return;
        const lidos = Math.min(stats.lidos, stats.total);
        const porc = (lidos / stats.total) * 100;
        document.getElementById('barraProgresso').style.width = porc + "%";
        document.getElementById('txtProgresso').innerText = `${lidos} de ${stats.total}`;
    }

    function atualizarProgressoManual() {
        let stats = JSON.parse(localStorage.getItem('stats_coleta') || '{"lidos":0,"total":0}');
        stats.lidos++;
        localStorage.setItem('stats_coleta', JSON.stringify(stats));
        atualizarInterfaceProgresso(stats);
    }

    window.addEventListener('load', () => {
        iniciarCamera();
        
        const salvo = localStorage.getItem('stats_coleta');
        if (salvo) atualizarInterfaceProgresso(JSON.parse(salvo));

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(e => console.log(e));
        }
    });

    VMasker(document.getElementById("inputPreco")).maskMoney({
        precision: 2, separator: ',', delimiter: '.', unit: 'R$', zeroCents: false
    });
    VMasker(document.getElementById("inputPreco2")).maskMoney({
        precision: 2, separator: ',', delimiter: '.', unit: 'R$', zeroCents: false
    });

    // Adaptação ao teclado virtual dos celulares.
    // O campo que receber foco é levado para a área visível.
    document.querySelectorAll('#inputPreco, #inputPreco2').forEach(input => {
        input.addEventListener('focus', () => {
            setTimeout(() => {
                input.scrollIntoView({
                    behavior: 'smooth',
                    block: 'center'
                });
            }, 300);
        });
    });
</script>
</body>
</html>
